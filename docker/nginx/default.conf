server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # REST API: every /api/ request goes to the Nette front controller in php-fpm.
    # nginx serves no files from backend/, so nothing but index.php is reachable.
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/www/index.php;
        # Nette derives the base path from SCRIPT_NAME; it must be the front controller, not the URL
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/www;
        fastcgi_pass php:9000;
    }

    # Frontend: Vite dev server (including the HMR WebSocket)
    location / {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
